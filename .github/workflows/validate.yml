name: validate

on:
  pull_request:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install 'jsonschema==4.26.0'
      - name: Validate data (immutability against the base of the PR / the previous push)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE=""
          if [ "$EVENT" = pull_request ]; then BASE="origin/$BASE_REF"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then BASE="$BEFORE"
          fi
          python3 scripts/validate.py ${BASE:+--base "$BASE"}
